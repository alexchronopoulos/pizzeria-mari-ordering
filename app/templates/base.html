<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#005586">
    <title>{% block title %}Pizzeria Mari Order Online{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/PM_icon_black.png', v=asset_version) }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/PM_icon_black.png', v=asset_version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_version) }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ url_for('storefront.index') }}">
        <img src="{{ url_for('static', filename='images/pizzeria-mari-logo-cream.png') }}" alt="Pizzeria Mari">
      </a>
      <div class="header-meta">
        <span>625 River St · Troy, NY</span>
        <a href="{{ url_for('storefront.index') }}#cart">Cart</a>
      </div>
    </header>
    {% block body %}{% endblock %}
    <footer class="site-footer" aria-label="Pizzeria Mari links">
      <a href="https://www.instagram.com/pizzeria_mari/" aria-label="Pizzeria Mari on Instagram" title="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1"></circle>
        </svg>
      </a>
      <a href="mailto:hello@pizzeriamari.com" aria-label="Email Pizzeria Mari" title="Email">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="5" width="19" height="14" rx="1"></rect>
          <path d="m3 6 9 7 9-7"></path>
        </svg>
      </a>
      <a href="https://pizzeriamari.com/" aria-label="Pizzeria Mari website" title="Website">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18M12 3c3 3.2 4.5 6.2 4.5 9S15 17.8 12 21c-3-3.2-4.5-6.2-4.5-9S9 6.2 12 3Z"></path>
        </svg>
      </a>
    </footer>
  </body>
</html>

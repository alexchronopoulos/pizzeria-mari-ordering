<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#005586">
    <title>{% block title %}Pizzeria Mari Order Online{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/PM_icon_black.png', v=asset_version) }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/PM_icon_black.png', v=asset_version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_version) }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ url_for('storefront.index') }}">
        <img src="{{ url_for('static', filename='images/pizzeria-mari-logo-cream.png') }}" alt="Pizzeria Mari">
      </a>
      <div class="header-meta">
        <span>625 River St · Troy, NY</span>
        <a href="{{ url_for('storefront.index') }}#cart">Cart</a>
      </div>
    </header>
    {% block body %}{% endblock %}
    <footer class="site-footer">
      <nav class="footer-links" aria-label="Pizzeria Mari links">
        <a class="footer-link" href="https://www.instagram.com/pizzeria_mari/" target="_blank" rel="noopener noreferrer" aria-label="Pizzeria Mari on Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="icon-fill" cx="17.5" cy="6.5" r="1"></circle>
          </svg>
        </a>
        <a class="footer-link" href="mailto:hello@pizzeriamari.com" aria-label="Email Pizzeria Mari" title="Email">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="1"></rect>
            <path d="m4 6 8 7 8-7"></path>
          </svg>
        </a>
        <a class="footer-link" href="https://pizzeriamari.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit the Pizzeria Mari website" title="Website">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9M12 3c-2.5 2.5-3.8 5.5-3.8 9s1.3 6.5 3.8 9"></path>
          </svg>
        </a>
      </nav>
    </footer>
  </body>
</html>

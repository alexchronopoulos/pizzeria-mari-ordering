[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "pizzeria-mari-ordering"
version = "0.18.11"
description = "A simple, capacity-aware online ordering portal for Pizzeria Mari."
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=26,<27",
    "httpx>=0.28,<1",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/fonts/*.md",
    "static/fonts/*.otf",
    "static/images/*.png",
]
